<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1730" viewBox="0 0 1200 1730" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Figure 2(a). LifeFlow operational state aggregate</title>
  <desc id="svgDesc">LifeFlowState owns six persistent collections. Core identifier references and the account-store boundary are shown separately.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17233d; }
      .figure-title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #5b6880; }
      .panel-title { font-size: 26px; font-weight: 700; }
      .stereotype { font-size: 16px; font-weight: 700; fill: #6336a5; }
      .body { font-size: 18px; }
      .body-small { font-size: 17px; }
      .section-label { font-size: 17px; font-weight: 700; }
      .note { font-size: 16px; font-style: italic; fill: #52627e; }
      .table-title { font-size: 24px; font-weight: 700; fill: #245478; }
      .table-head { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .table-class { font-size: 17px; font-weight: 700; }
      .table-text { font-size: 17px; }
      .ref-title { font-size: 20px; font-weight: 700; fill: #8b4b00; }
      .chip-text { font-size: 13px; font-weight: 600; fill: #37445e; }
      .multiplicity { font-size: 13px; font-weight: 700; fill: #3a4f6b; }
    </style>
  </defs>

  <rect width="1200" height="1730" fill="#f9fbfe"/>
  <rect x="0.5" y="0.5" width="1199" height="1729" fill="none" stroke="#d1d9e6"/>

  <text x="60" y="58" class="figure-title">Figure 2(a). LifeFlow operational state aggregate</text>
  <text x="60" y="86" class="subtitle">Selected members and relationships verified against the implemented Java classes</text>

  <!-- LifeFlowState -->
  <rect x="60" y="140" width="1080" height="500" rx="12" fill="#ffffff" stroke="#17233d" stroke-width="1.5"/>
  <text x="80" y="184" class="panel-title">LifeFlowState</text>
  <text x="80" y="220" class="stereotype">«final class»</text>

  <text x="80" y="260" class="body">
    <tspan x="80" dy="0">− revision: long</tspan>
    <tspan x="80" dy="27">− donors: ArrayList&lt;Donor&gt;</tspan>
    <tspan x="80" dy="27">− units: ArrayList&lt;BloodUnit&gt;</tspan>
    <tspan x="80" dy="27">− requests: ArrayList&lt;BloodRequest&gt;</tspan>
    <tspan x="80" dy="27">− fulfilments: ArrayList&lt;FulfilmentRecord&gt;</tspan>
    <tspan x="80" dy="27">− appointments: ArrayList&lt;DonationAppointment&gt;</tspan>
    <tspan x="80" dy="27">− logs: ArrayList&lt;String&gt;</tspan>
  </text>

  <text x="80" y="465" class="body-small">
    <tspan x="80" dy="0">+ copy(): LifeFlowState</tspan>
    <tspan x="80" dy="26">+ getDonors() / getUnits() / getRequests(): deep copies</tspan>
    <tspan x="80" dy="26">+ getFulfilments() / getAppointments() / getLogs(): deep copies</tspan>
  </text>

  <text x="80" y="560" class="section-label">Snapshot semantics</text>
  <text x="80" y="594" class="note">
    <tspan x="80" dy="0">Every collection getter returns a new copy. Controller use cases build a complete candidate state, persist it, and publish</tspan>
    <tspan x="80" dy="23">candidate.copy() only after the primary save succeeds.</tspan>
  </text>

  <!-- Composition connector, deliberately isolated in the gap -->
  <polygon points="600,640 609,649 600,658 591,649" fill="#3b506e"/>
  <line x1="600" y1="658" x2="600" y2="700" stroke="#3b506e" stroke-width="2"/>
  <text x="576" y="666" class="multiplicity">1</text>
  <text x="622" y="674" class="multiplicity">owns</text>
  <text x="622" y="696" class="multiplicity">0..*</text>

  <!-- Owned collections -->
  <rect x="60" y="700" width="1080" height="740" rx="12" fill="#ffffff" stroke="#2478b5" stroke-width="1.5"/>
  <text x="80" y="744" class="table-title">Owned collections  ·  composition 1 → 0..*</text>

  <rect x="80" y="770" width="1040" height="44" rx="5" fill="#367ca9"/>
  <text x="92" y="798" class="table-head">Class</text>
  <text x="315" y="798" class="table-head">Persistent fields (selected)</text>
  <text x="850" y="798" class="table-head">Key behaviour</text>

  <rect x="80" y="824" width="1040" height="94" rx="5" fill="#f2faf8" stroke="#bfd2df"/>
  <text x="92" y="854" class="table-class"><tspan x="92">Donor</tspan><tspan x="92" dy="22">implements Identifiable</tspan></text>
  <text x="315" y="854" class="table-text"><tspan x="315">id, name, age, weightKg, bloodType,</tspan><tspan x="315" dy="22">externalLastDonationDate</tspan></text>
  <text x="850" y="854" class="table-text"><tspan x="850">updateDetails(...)</tspan><tspan x="850" dy="22">getId()</tspan></text>

  <rect x="80" y="928" width="1040" height="94" rx="5" fill="#f7f9fc" stroke="#bfd2df"/>
  <text x="92" y="958" class="table-class"><tspan x="92">BloodUnit</tspan><tspan x="92" dy="22">implements Identifiable</tspan></text>
  <text x="315" y="958" class="table-text"><tspan x="315">id, donorId, bloodType, donationDate,</tspan><tspan x="315" dy="22">expiryDate, status</tspan></text>
  <text x="850" y="950" class="table-text"><tspan x="850">getInventoryState(date)</tspan><tspan x="850" dy="20">markReserved() / markUsed()</tspan><tspan x="850" dy="20">markAvailable()</tspan><tspan x="850" dy="20">markDiscarded()</tspan></text>

  <rect x="80" y="1032" width="1040" height="94" rx="5" fill="#f2faf8" stroke="#bfd2df"/>
  <text x="92" y="1062" class="table-class"><tspan x="92">«abstract» BloodRequest</tspan><tspan x="92" dy="22">implements Identifiable</tspan></text>
  <text x="315" y="1062" class="table-text"><tspan x="315">id, requesterName, hospitalId, bloodType,</tspan><tspan x="315" dy="22">quantity, requestDate, status</tspan></text>
  <text x="850" y="1062" class="table-text"><tspan x="850">getPriority() · getKind()</tspan><tspan x="850" dy="22">markFulfilled()</tspan><tspan x="850" dy="22">markCancelled()</tspan></text>

  <rect x="80" y="1136" width="1040" height="94" rx="5" fill="#f7f9fc" stroke="#bfd2df"/>
  <text x="92" y="1166" class="table-class"><tspan x="92">DonationAppointment</tspan><tspan x="92" dy="22">implements Identifiable</tspan></text>
  <text x="315" y="1166" class="table-text"><tspan x="315">id, donorId, hospitalId, appointmentDate,</tspan><tspan x="315" dy="22">linkedRequestId, status</tspan></text>
  <text x="850" y="1166" class="table-text"><tspan x="850">isBooked() · isStale(today)</tspan><tspan x="850" dy="22">markCompleted()</tspan><tspan x="850" dy="22">markCancelled()</tspan></text>

  <rect x="80" y="1240" width="1040" height="82" rx="5" fill="#f2faf8" stroke="#bfd2df"/>
  <text x="92" y="1272" class="table-class">«record» FulfilmentRecord</text>
  <text x="315" y="1268" class="table-text"><tspan x="315">requestId, processedDate,</tspan><tspan x="315" dy="22">unitIds: List&lt;String&gt;</tspan></text>
  <text x="850" y="1268" class="table-text"><tspan x="850">immutable unit ID list</tspan><tspan x="850" dy="22">tracks partial or complete allocation</tspan></text>

  <rect x="80" y="1332" width="1040" height="72" rx="5" fill="#f7f9fc" stroke="#bfd2df"/>
  <text x="92" y="1360" class="table-class"><tspan x="92">Audit log entries</tspan><tspan x="92" dy="20">String</tspan></text>
  <text x="315" y="1360" class="table-text">logs: ArrayList&lt;String&gt;</text>
  <text x="850" y="1358" class="table-text"><tspan x="850">getLogs() returns a copy</tspan><tspan x="850" dy="22">controller appends audit entries</tspan></text>

  <!-- Core ID references and external storage boundary -->
  <rect x="60" y="1480" width="1080" height="210" rx="12" fill="#fffaf0" stroke="#e67e00" stroke-width="1.5"/>
  <text x="80" y="1518" class="ref-title">Core ID references and external storage boundary</text>

  <rect x="80" y="1542" width="260" height="56" rx="6" fill="#f4f9fd" stroke="#75add6"/>
  <text x="94" y="1576" class="chip-text">BloodUnit.donorId  →  Donor.id</text>

  <rect x="350" y="1542" width="430" height="56" rx="6" fill="#f4f9fd" stroke="#75add6"/>
  <text x="364" y="1567" class="chip-text"><tspan x="364">DonationAppointment.linkedRequestId  →  BloodRequest.id</tspan><tspan x="364" dy="19">(optional)</tspan></text>

  <rect x="790" y="1542" width="330" height="56" rx="6" fill="#f4f9fd" stroke="#75add6"/>
  <text x="804" y="1576" class="chip-text">FulfilmentRecord.requestId  →  BloodRequest.id</text>

  <rect x="80" y="1610" width="300" height="58" rx="6" fill="#fff8eb" stroke="#e67e00"/>
  <text x="94" y="1645" class="chip-text">FulfilmentRecord.unitIds  →  BloodUnit.id</text>

  <rect x="390" y="1610" width="430" height="68" rx="6" fill="#fff8eb" stroke="#e67e00"/>
  <text x="404" y="1630" class="chip-text"><tspan x="404">BloodRequest.hospitalId / DonationAppointment.hospitalId</tspan><tspan x="404" dy="19">→ Hospital.id  ·  HospitalRegistry / JsonHospitalStore</tspan></text>

  <rect x="830" y="1610" width="290" height="68" rx="6" fill="#fff8eb" stroke="#e67e00"/>
  <text x="844" y="1629" class="chip-text"><tspan x="844">DonorAccount.donorId  →  Donor.id</tspan><tspan x="844" dy="18">DonorRegistry / JsonDonorStore</tspan><tspan x="844" dy="18">outside LifeFlowState</tspan></text>
</svg>
